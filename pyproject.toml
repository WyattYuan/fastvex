[project]
name = "fastvex"
version = "0.1.2"
description = "Fast VEX V5 slot-oriented deploy CLI"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "click>=8.0.0",
  "pydantic>=2.11",
  "rich>=13.0",
  "typer>=0.16.0",
]

[project.scripts]
fastvex = "fastvex.cli:main"
fvx = "fastvex.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.5",
  "ruff>=0.11.2",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastvex"]

[tool.hatch.build.targets.sdist]
include = [
  "src/fastvex",
  "tests",
  "LICENSE",
  "README.md",
]
